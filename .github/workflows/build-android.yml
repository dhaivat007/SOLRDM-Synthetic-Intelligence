name: Build SOLRDM Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default includes the removed SDK package "tools".
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check environment
        run: |
          mkdir -p evidence dist
          { java -version; gradle --version; python --version; sdkmanager --list_installed; } 2>&1 | tee evidence/environment.log
      - name: Test Python engine and Android bridge
        run: python -m unittest discover -s tests -v 2>&1 | tee evidence/python-tests.log
      - name: Benchmark symbolic and neural components separately
        run: python scripts/benchmark_engine.py > evidence/engine-benchmarks.json
      - name: Configure optional persistent debug signing
        env:
          SOLRDM_DEBUG_KEYSTORE_BASE64: ${{ secrets.SOLRDM_DEBUG_KEYSTORE_BASE64 }}
          SOLRDM_DEBUG_STORE_PASSWORD: ${{ secrets.SOLRDM_DEBUG_STORE_PASSWORD }}
          SOLRDM_DEBUG_KEY_ALIAS: ${{ secrets.SOLRDM_DEBUG_KEY_ALIAS }}
          SOLRDM_DEBUG_KEY_PASSWORD: ${{ secrets.SOLRDM_DEBUG_KEY_PASSWORD }}
        run: |
          if [[ -n "$SOLRDM_DEBUG_KEYSTORE_BASE64" ]]; then
            test -n "$SOLRDM_DEBUG_STORE_PASSWORD"
            test -n "$SOLRDM_DEBUG_KEY_ALIAS"
            test -n "$SOLRDM_DEBUG_KEY_PASSWORD"
            printf '%s' "$SOLRDM_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/solrdm-debug.keystore"
            chmod 600 "$RUNNER_TEMP/solrdm-debug.keystore"
            echo "SOLRDM_DEBUG_KEYSTORE=$RUNNER_TEMP/solrdm-debug.keystore" >> "$GITHUB_ENV"
            echo 'Using configured persistent debug signing.'
          else
            echo 'Using an ephemeral development key; future in-place updates require the same key.'
          fi
      - name: Build signed debug APK and run Android checks
        env:
          SOLRDM_DEBUG_STORE_PASSWORD: ${{ secrets.SOLRDM_DEBUG_STORE_PASSWORD }}
          SOLRDM_DEBUG_KEY_ALIAS: ${{ secrets.SOLRDM_DEBUG_KEY_ALIAS }}
          SOLRDM_DEBUG_KEY_PASSWORD: ${{ secrets.SOLRDM_DEBUG_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug 2>&1 | tee evidence/gradle.log
      - name: Verify signed APK and record provenance
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dist/SOLRDM-0.7.3-debug.apk
          bash scripts/verify-apk.sh dist/SOLRDM-0.7.3-debug.apk
          cp docs/source-provenance.json evidence/engine-benchmarks.json dist/
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SOLRDM-Android-v0.7.3-debug-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: SOLRDM-Android-v0.7.3-test-APK
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 30
      - name: Retain build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOLRDM-build-evidence
          path: |
            evidence/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 30

  emulator:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: SOLRDM-Android-v0.7.3-debug-APK
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: SOLRDM-Android-v0.7.3-test-APK
          path: test-apk
      - name: Build signing-conflict regression fixtures
        run: bash scripts/build-installation-fixtures.sh installation-fixtures
      - name: Independently verify downloaded artifact
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs SOLRDM-0.7.3-debug.apk
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test the published APK on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: bash scripts/smoke-test.sh dist/SOLRDM-0.7.3-debug.apk test-apk/app-debug-androidTest.apk installation-fixtures/legacy-old.apk installation-fixtures/legacy-replacement.apk
      - name: Retain emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOLRDM-emulator-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
