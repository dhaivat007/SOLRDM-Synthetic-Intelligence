plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
 namespace 'org.solrdm.app'
 compileSdk 35
 useLibrary 'android.test.runner'
 useLibrary 'android.test.base'
 defaultConfig {
  applicationId 'org.solrdm.agent'
  minSdk 26
  targetSdk 35
  versionCode 11
  versionName '0.8.0'
  resValue 'string', 'app_name', 'SOLRDM Agent'
  testInstrumentationRunner 'android.test.InstrumentationTestRunner'
  ndk { abiFilters 'arm64-v8a', 'x86_64' }
 }
 signingConfigs {
  debug {
   if (System.getenv('SOLRDM_DEBUG_KEYSTORE')) {
    storeFile file(System.getenv('SOLRDM_DEBUG_KEYSTORE'))
    storePassword System.getenv('SOLRDM_DEBUG_STORE_PASSWORD')
    keyAlias System.getenv('SOLRDM_DEBUG_KEY_ALIAS')
    keyPassword System.getenv('SOLRDM_DEBUG_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  debug {
   applicationIdSuffix '.debug'
   resValue 'string', 'app_name', 'SOLRDM Agent'
  }
 }
}
chaquopy { defaultConfig { version = '3.11' } }

tasks.register('prepareAgentAssets', Exec) {
 workingDir rootProject.projectDir
 commandLine 'node', 'scripts/package-agent-assets.mjs'
 inputs.dir rootProject.file('web-agent/web')
 inputs.file rootProject.file('web-agent/src/tools.mjs')
 inputs.file rootProject.file('scripts/package-agent-assets.mjs')
 outputs.dir file('src/main/assets/agent')
}
tasks.named('preBuild').configure { dependsOn 'prepareAgentAssets' }
